<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Atlas Giải Phẫu Học 3D • Y Khoa</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    svitylo-anatomy {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="module" src="./vendor-atlas.js"></script>
</head>
<body>
  <svitylo-anatomy
    theme="dark"
    lang="vi"
    ui-lang="vi"
    data-url="/api/anatomy-data/1.1.0/"
    data-atlas-location="full"
  ></svitylo-anatomy>

  <script type="module">
    const atlas = document.querySelector('svitylo-anatomy');

    // Notify parent window when an anatomical structure is selected in 3D
    atlas.addEventListener('anatomy:select', (e) => {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'ANATOMY_SELECT',
            ids: e.detail?.ids || [],
            source: e.detail?.source
          }, '*');
        }
      } catch (err) {
        console.warn(err);
      }
    });

    // Handle messages from parent React component
    window.addEventListener('message', (e) => {
      if (!e.data || !atlas) return;
      if (e.data.type === 'SET_STATE' && e.data.state) {
        atlas.setAttribute('state', e.data.state);
      }
      if (e.data.type === 'SET_LANG' && e.data.lang) {
        atlas.setAttribute('lang', e.data.lang);
        atlas.setAttribute('ui-lang', e.data.lang);
      }
    });
  </script>
</body>
</html>
